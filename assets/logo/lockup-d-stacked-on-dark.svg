<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 235 80" width="235" height="80" role="img" aria-label="Help Studios — people data, connected">
  <title>Help Studios — people data, connected</title>
  <!-- Stacked lockup, for dark grounds: used where the horizontal lockup would be
       squeezed — a slide corner, a banner, a square social card, the back of a card.
       The wordmark pair is centred on the mark, and the tagline is centred on the
       pair, so the block has one axis.

         mark       49 x 22 at 1:1, x 90.98..139.98 (centred on 115.48), y 0..22
         wordmark   baseline 58 (22 + 12 clear + cap 24); HELP 0..85.61,
                    STUDIOS 91.61..230.96
         tagline    text-anchor middle at 115.48, baseline 76, ink 215.14 wide
         ink box    230.96 x 76 -->
  <style>
    .hss-wm  { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 32px; letter-spacing: 1.44px; font-kerning: normal; }
    .hss-wm-heavy { font-weight: 780; fill: #e8eef7; }
    .hss-wm-light { font-weight: 300; fill: #e8eef7; }
    .hss-tag { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 3.15px; fill: #2dd4bf; }
  </style>

  <g transform="translate(90.98 0)">
    <path fill="#2dd4bf" fill-rule="evenodd" d="M2 0H17A2 2 0 0 1 19 2V20A2 2 0 0 1 17 22H2A2 2 0 0 1 0 20V2A2 2 0 0 1 2 0ZM19 9H17.2933A3.6 3.6 0 1 0 17.2933 13H19Z"/>
    <g fill="#eab308">
      <circle cx="25.3" cy="11" r="3.6"/>
      <rect x="26.5" y="9" width="4.5" height="4"/>
    </g>
    <path fill="#2dd4bf" d="M32 0H47A2 2 0 0 1 49 2V20A2 2 0 0 1 47 22H32A2 2 0 0 1 30 20V2A2 2 0 0 1 32 0Z"/>
  </g>

  <text class="hss-wm hss-wm-heavy" x="0" y="58">HELP</text>
  <text class="hss-wm hss-wm-light" x="91.61" y="58">STUDIOS</text>
  <text class="hss-tag" x="115.48" y="76" text-anchor="middle">PEOPLE DATA. CONNECTED.</text>
</svg>
