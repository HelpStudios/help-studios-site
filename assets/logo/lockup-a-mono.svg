<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 293 48" width="293" height="48" role="img" aria-label="Help Studios — people data, connected">
  <title>Help Studios — people data, connected</title>
  <!-- One-colour lockup: everything is currentColor, so it inherits the text
       colour when inlined, and prints from a single plate. The tagline is set at
       72% opacity rather than a second ink — screening is available on every
       press, a second spot colour is not. -->
  <style>
    .hs-wm  { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 32px; letter-spacing: 1.44px; font-kerning: normal; }
    .hs-wm-heavy { font-weight: 780; fill: currentColor; }
    .hs-wm-light { font-weight: 300; fill: currentColor; }
    .hs-tag { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 3.15px; fill: currentColor; fill-opacity: 0.72; }
  </style>

  <g transform="scale(1.1)" color="currentColor">
    <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
      <path d="M2.5 14.9V37.5"/>
      <path d="M29.5 14.9V37.5"/>
      <path d="M2.5 26.2H29.5"/>
    </g>
    <circle cx="29.5" cy="3.6" r="3.6" fill="currentColor"/>
  </g>

  <text class="hs-wm hs-wm-heavy" x="57.2" y="25.75">HELP</text>
  <text class="hs-wm hs-wm-light" x="148.81" y="25.75">STUDIOS</text>
  <text class="hs-tag" x="57.2" y="43.75">PEOPLE DATA. CONNECTED.</text>
</svg>
