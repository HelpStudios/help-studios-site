<svg xmlns="http://www.w3.org/2000/svg" viewBox="-2 -2 299 48" width="299" height="48" role="img" aria-label="Help Studios — people data, connected">
  <title>Help Studios — people data, connected</title>
  <!-- Primary lockup for dark grounds: mark D, then the wordmark, then the standing
       line. The type block is byte-for-byte the one in lockup-a-on-dark.svg — same
       size, weights, tracking and measured positions — so the two marks are
       interchangeable without re-cutting the words.

       Layout, all of it measured rather than eyeballed:
         · mark       49 x 22 at 1:1, x 0..49, y 2.75..24.75. Scale 1:1 is a
                      deliberate change from mark A's 1.1: it puts the mark exactly
                      on the cap band (1.75..25.75), so it reads as part of the line
                      of type rather than as an illustration parked beside it. A
                      wide mark at 1.1 would have been 24.2 tall and 53.8 wide and
                      would have started to out-shout the words
         · clear       15 units from the mark's right edge to the H (A used 22, but
                      A's mark is portrait and needs the air; this one is wide and
                      does not)
         · wordmark   Inter 32 px (cap height 24), cap top 1.75, baseline 25.75,
                      weight contrast HELP 780 / STUDIOS 300, tracking 1.44 px
                      (0.045 em): HELP 64..149.61, 6 px word space, STUDIOS
                      155.61..294.96
         · tagline    Inter 10.5 px, 600, 3.15 px tracking (0.30 em), baseline 43.75,
                      ends at 279.14 — inside the wordmark's right edge, which is
                      what stops the block looking ragged

       Type: Inter is bundled with the site (assets/fonts). The fallback stack is
       Helvetica Neue then Arial, so a machine without Inter still sets the words in
       a grotesque of the right proportion rather than in Times. <img src="…svg">
       cannot load a webfont, which is why the PNG masters in png/ exist and are the
       files to use in decks, email and print. -->
  <!-- Class names carry a d- prefix on purpose: an inlined SVG's <style> is not
       scoped to that svg, it applies to the whole page. The lab puts all four
       colourways on one sheet, so without the prefix the last-declared ink wins
       and the light lockup renders white on white. -->
  <style>
    .hsd-wm  { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 32px; letter-spacing: 1.44px; font-kerning: normal; }
    .hsd-wm-heavy { font-weight: 780; fill: #e8eef7; }
    .hsd-wm-light { font-weight: 300; fill: #e8eef7; }
    .hsd-tag { font-family: 'Inter', 'Helvetica Neue', Arial, sans-serif; font-size: 10.5px; font-weight: 600; letter-spacing: 3.15px; fill: #2dd4bf; }
  </style>

  <g transform="translate(0 2.75)">
    <path fill="#2dd4bf" fill-rule="evenodd" d="M2 0H17A2 2 0 0 1 19 2V20A2 2 0 0 1 17 22H2A2 2 0 0 1 0 20V2A2 2 0 0 1 2 0ZM19 9H17.2933A3.6 3.6 0 1 0 17.2933 13H19Z"/>
    <g fill="#eab308">
      <circle cx="25.3" cy="11" r="3.6"/>
      <rect x="26.5" y="9" width="4.5" height="4"/>
    </g>
    <path fill="#2dd4bf" d="M32 0H47A2 2 0 0 1 49 2V20A2 2 0 0 1 47 22H32A2 2 0 0 1 30 20V2A2 2 0 0 1 32 0Z"/>
  </g>

  <text class="hsd-wm hsd-wm-heavy" x="64" y="25.75">HELP</text>
  <text class="hsd-wm hsd-wm-light" x="155.61" y="25.75">STUDIOS</text>
  <text class="hsd-tag" x="64" y="43.75">PEOPLE DATA. CONNECTED.</text>
</svg>
