<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 49 22" width="49" height="22" role="img" aria-label="Help Studios">
  <title>Help Studios</title>
  <!-- Mark D on a light ground. Same geometry as mark-d-on-dark.svg; only the ink
       changes, so the two can never drift.

       #2dd4bf measures 1.85:1 against white and #eab308 about 1.9:1, so the light
       variant steps down to teal 700 (#0f766e, 4.9:1) and amber 700 (#b45309,
       4.6:1) — the same substitution mark-a-on-light.svg makes, which keeps the
       family on one rule: bright tokens on screens, 700s on paper and projectors. -->
  <path fill="#0f766e" fill-rule="evenodd" d="M2 0H17A2 2 0 0 1 19 2V20A2 2 0 0 1 17 22H2A2 2 0 0 1 0 20V2A2 2 0 0 1 2 0ZM19 9H17.2933A3.6 3.6 0 1 0 17.2933 13H19Z"/>
  <g fill="#b45309">
    <circle cx="25.3" cy="11" r="3.6"/>
    <rect x="26.5" y="9" width="4.5" height="4"/>
  </g>
  <path fill="#0f766e" d="M32 0H47A2 2 0 0 1 49 2V20A2 2 0 0 1 47 22H32A2 2 0 0 1 30 20V2A2 2 0 0 1 32 0Z"/>
</svg>
