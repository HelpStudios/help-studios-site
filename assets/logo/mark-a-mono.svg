<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 40" width="32" height="40" role="img" aria-label="Help Studios">
  <title>Help Studios</title>
  <!-- Mark A, single ink. Everything is currentColor, so the mark takes the
       colour of the text it sits beside when inlined, and prints from one plate.
       The node stays a solid dot rather than a knockout: at 16 px a hollow dot
       fills in, and a one-colour logo has to survive a photocopier. -->
  <g fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round">
    <path d="M2.5 14.9V37.5"/>
    <path d="M29.5 14.9V37.5"/>
    <path d="M2.5 26.2H29.5"/>
  </g>
  <circle cx="29.5" cy="3.6" r="3.6" fill="currentColor"/>
</svg>
