<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 49 22" width="49" height="22" role="img" aria-label="Help Studios">
  <title>Help Studios</title>
  <!-- Mark D, single ink. Everything is currentColor, so the mark takes the colour
       of the text beside it when inlined, and prints from one plate.

       The amber knob and the arriving piece collapse into one silhouette here, and
       that is the honest result: in one colour there is no second accent to spend,
       so the mark has to carry the story on outline alone — two pieces, a socket,
       a knob not yet in it. It survives that test, which is the reason it is drawn
       as a silhouette rather than as line work. -->
  <path fill="currentColor" fill-rule="evenodd" d="M2 0H17A2 2 0 0 1 19 2V20A2 2 0 0 1 17 22H2A2 2 0 0 1 0 20V2A2 2 0 0 1 2 0ZM19 9H17.2933A3.6 3.6 0 1 0 17.2933 13H19Z"/>
  <g fill="currentColor">
    <circle cx="25.3" cy="11" r="3.6"/>
    <rect x="26.5" y="9" width="4.5" height="4"/>
  </g>
  <path fill="currentColor" d="M32 0H47A2 2 0 0 1 49 2V20A2 2 0 0 1 47 22H32A2 2 0 0 1 30 20V2A2 2 0 0 1 32 0Z"/>
</svg>
